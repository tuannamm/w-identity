<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1010" role="img" aria-labelledby="title desc">
<title id="title">Luồng phân quyền: từ đăng nhập đến từng request</title>
<desc id="desc">Phần A: sau khi đăng nhập, UI gọi gateway để lấy role và permission của mình rồi render giao diện. Phần B: với mỗi request, gateway xác minh JWT, tra permission của user từ w-identity (có cache), so với x-required-permissions của operation; thiếu quyền thì 403, tra lỗi thì 503, đủ quyền mới chuyển request tới service.</desc>
<defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2765b3"/></marker><marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a45c10"/></marker></defs>
<rect width="1100" height="1010" rx="20" fill="#f8fafc"/>
<g font-family="Arial, sans-serif" fill="#172b4d" text-anchor="middle">
<text x="35" y="36" text-anchor="start" font-size="23" font-weight="700">PHÂN QUYỀN: TỪ ĐĂNG NHẬP ĐẾN TỪNG REQUEST</text>
<line x1="110" y1="104" x2="110" y2="990" stroke="#b6c3d4" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="320" y1="104" x2="320" y2="990" stroke="#b6c3d4" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="550" y1="104" x2="550" y2="990" stroke="#b6c3d4" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="790" y1="104" x2="790" y2="990" stroke="#b6c3d4" stroke-width="2" stroke-dasharray="6 6"/>
<line x1="1000" y1="104" x2="1000" y2="990" stroke="#b6c3d4" stroke-width="2" stroke-dasharray="6 6"/>
<rect x="30" y="50" width="160" height="54" rx="12" fill="#fce7ed" stroke="#96a7bd" stroke-width="1.5"/>
<text x="110" y="73" font-size="17" font-weight="700">Client / UI</text><text x="110" y="93" font-size="12.5" fill="#44546a">trình duyệt, app</text>
<rect x="240" y="50" width="160" height="54" rx="12" fill="#fff0c5" stroke="#96a7bd" stroke-width="1.5"/>
<text x="320" y="73" font-size="17" font-weight="700">Keycloak</text><text x="320" y="93" font-size="12.5" fill="#44546a">đăng nhập, cấp JWT</text>
<rect x="470" y="50" width="160" height="54" rx="12" fill="#dff3ee" stroke="#96a7bd" stroke-width="1.5"/>
<text x="550" y="73" font-size="17" font-weight="700">API Gateway</text><text x="550" y="93" font-size="12.5" fill="#44546a">xác minh JWT, chặn quyền</text>
<rect x="710" y="50" width="160" height="54" rx="12" fill="#e6edfa" stroke="#96a7bd" stroke-width="1.5"/>
<text x="790" y="73" font-size="17" font-weight="700">w-identity</text><text x="790" y="93" font-size="12.5" fill="#44546a">role, permission, hồ sơ</text>
<rect x="920" y="50" width="160" height="54" rx="12" fill="#eef0f3" stroke="#96a7bd" stroke-width="1.5"/>
<text x="1000" y="73" font-size="17" font-weight="700">MongoDB</text><text x="1000" y="93" font-size="12.5" fill="#44546a">user_roles, roles</text>
<rect x="20" y="116" width="1060" height="30" rx="8" fill="#2765b3" opacity="0.14"/>
<text x="35" y="136" text-anchor="start" font-size="16" font-weight="700" fill="#2765b3">A · SAU KHI ĐĂNG NHẬP: UI hỏi "tôi có quyền gì?" để quyết định render (chỉ để hiển thị)</text>
<line x1="110" y1="176" x2="320" y2="176" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="215.0" y="168" font-size="14" fill="#2765b3" font-weight="600">1. Đăng nhập</text>
<line x1="320" y1="204" x2="110" y2="204" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="215.0" y="196" font-size="14" fill="#a45c10" font-weight="600">JWT: sub, iss, exp...</text>
<line x1="110" y1="242" x2="550" y2="242" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="330.0" y="234" font-size="14" fill="#2765b3" font-weight="600">2. GET /me/permissions + JWT</text>
<rect x="564" y="254" width="310" height="56" rx="9" fill="#fff" stroke="#1d7a5f" stroke-width="1.6"/>
<text x="719.0" y="276" font-size="13.5" fill="#1d7a5f">Xác minh JWT (chữ ký, iss, aud, exp)</text>
<text x="719.0" y="298" font-size="13.5" fill="#1d7a5f">Lấy sub; không đọc role từ token</text>
<line x1="550" y1="348" x2="790" y2="348" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="670.0" y="340" font-size="14" fill="#2765b3" font-weight="600">3. identity.me.permissions</text>
<line x1="790" y1="378" x2="1000" y2="378" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="895.0" y="370" font-size="14" fill="#2765b3" font-weight="600">user_roles → roles</text>
<line x1="1000" y1="404" x2="790" y2="404" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="895.0" y="396" font-size="14" fill="#a45c10" font-weight="600">role + permissionKeys</text>
<line x1="790" y1="434" x2="550" y2="434" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="670.0" y="426" font-size="14" fill="#a45c10" font-weight="600">{ role, permissions[] }</text>
<line x1="550" y1="462" x2="110" y2="462" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="330.0" y="454" font-size="14" fill="#a45c10" font-weight="600">200: UI render menu / nút theo permissions</text>
<rect x="20" y="496" width="1060" height="30" rx="8" fill="#2765b3" opacity="0.14"/>
<text x="35" y="516" text-anchor="start" font-size="16" font-weight="700" fill="#2765b3">B · MỖI REQUEST: gateway kiểm tra TRƯỚC khi chuyển; client KHÔNG gửi permission</text>
<line x1="110" y1="558" x2="550" y2="558" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="330.0" y="550" font-size="14" fill="#2765b3" font-weight="600">4. Request + JWT (không có permission)</text>
<rect x="564" y="570" width="360" height="78" rx="9" fill="#fff" stroke="#1d7a5f" stroke-width="1.6"/>
<text x="744.0" y="592" font-size="13.5" fill="#1d7a5f">Xác minh JWT → sub</text>
<text x="744.0" y="614" font-size="13.5" fill="#1d7a5f">Route cần: x-required-permissions</text>
<text x="744.0" y="636" font-size="13.5" fill="#1d7a5f">(OpenAPI; thiếu khai báo = lỗi lúc khởi động)</text>
<line x1="550" y1="688" x2="790" y2="688" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="670.0" y="680" font-size="14" fill="#2765b3" font-weight="600">5. identity.authz.permissions</text>
<rect x="220" y="680" width="250" height="56" rx="9" fill="#fff" stroke="#a45c10" stroke-width="1.6"/>
<text x="345.0" y="702" font-size="13.5" fill="#a45c10">Cache theo userId, TTL 30s</text>
<text x="345.0" y="724" font-size="13.5" fill="#a45c10">Trúng cache: bỏ bước 5</text>
<line x1="790" y1="724" x2="1000" y2="724" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="895.0" y="716" font-size="14" fill="#2765b3" font-weight="600">user_roles → roles</text>
<line x1="1000" y1="750" x2="790" y2="750" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="895.0" y="742" font-size="14" fill="#a45c10" font-weight="600">dữ liệu</text>
<line x1="790" y1="780" x2="550" y2="780" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="670.0" y="772" font-size="14" fill="#a45c10" font-weight="600">permissions[] (tài khoản khóa → rỗng)</text>
<rect x="300" y="800" width="500" height="62" rx="10" fill="#fff" stroke="#b3304a" stroke-width="1.8"/>
<text x="550" y="825" font-size="14" fill="#b3304a" font-weight="700">So với yêu cầu của operation (phải có ĐỦ tất cả)</text>
<text x="550" y="847" font-size="13.5" fill="#b3304a">thiếu → 403 FORBIDDEN · tra cứu lỗi → 503 (từ chối khi không chắc)</text>
<line x1="550" y1="892" x2="790" y2="892" stroke="#2765b3" stroke-width="2.4" marker-end="url(#b)"/>
<text x="670.0" y="884" font-size="14" fill="#2765b3" font-weight="600">6. Đủ quyền: chuyển request (RPC)</text>
<rect x="804" y="904" width="240" height="56" rx="9" fill="#fff" stroke="#1d7a5f" stroke-width="1.6"/>
<text x="924.0" y="926" font-size="13.5" fill="#1d7a5f">Service vẫn tự kiểm tra quy tắc</text>
<text x="924.0" y="948" font-size="13.5" fill="#1d7a5f">theo dữ liệu (bước sau)</text>
<line x1="790" y1="976" x2="110" y2="976" stroke="#a45c10" stroke-width="2.4" stroke-dasharray="7 5" marker-end="url(#o)"/>
<text x="450.0" y="968" font-size="14" fill="#a45c10" font-weight="600">200 / lỗi trả về qua gateway</text>
</g></svg>