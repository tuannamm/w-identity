<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc">
  <title id="title">Luồng cập nhật hồ sơ w-identity</title>
  <desc id="desc">Luồng chạy từ client qua gateway, controller, CommandBus, handler Application, port và repository đến MongoDB; use case và repository phụ thuộc port.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#526783"/></marker></defs>
  <rect width="1000" height="430" rx="18" fill="#f4f7fc"/>
  <g font-family="Arial,sans-serif" fill="#172b4d">
    <text x="35" y="42" font-size="23" font-weight="700">Cập nhật hồ sơ · luồng thực tế</text>
    <text x="35" y="78" font-size="16" font-weight="700" fill="#4b6484">1. Lời gọi lúc chạy</text>
    <g fill="#fff" stroke="#a5b8cf" stroke-width="2">
      <rect x="25" y="100" width="125" height="72" rx="12"/><rect x="175" y="100" width="125" height="72" rx="12"/>
      <rect x="325" y="100" width="145" height="72" rx="12"/><rect x="495" y="100" width="145" height="72" rx="12"/>
      <rect x="665" y="100" width="145" height="72" rx="12"/><rect x="835" y="100" width="140" height="72" rx="12"/>
    </g>
    <g text-anchor="middle" font-size="15" font-weight="700">
      <text x="87" y="130">Client</text><text x="87" y="151" font-size="12" font-weight="400">PATCH /me</text>
      <text x="237" y="130">Gateway</text><text x="237" y="151" font-size="12" font-weight="400">xác minh JWT</text>
      <text x="397" y="130">TCP controller</text><text x="397" y="151" font-size="12" font-weight="400">DTO → Actor</text>
      <text x="567" y="130">CommandBus</text><text x="567" y="151" font-size="10" font-weight="400">→ UpdateMyProfileHandler</text>
      <text x="737" y="130">Profile port</text><text x="737" y="151" font-size="12" font-weight="400">update(userId, patch)</text>
      <text x="905" y="130">UserRepository</text><text x="905" y="151" font-size="12" font-weight="400">upsert MongoDB</text>
    </g>
    <g stroke="#526783" stroke-width="2" marker-end="url(#arrow)"><path d="M150 136H170"/><path d="M300 136H320"/><path d="M470 136H490"/><path d="M640 136H660"/><path d="M810 136H830"/></g>
    <text x="35" y="220" font-size="16" font-weight="700" fill="#4b6484">2. Dependency mã nguồn</text>
    <g stroke-width="2"><rect x="100" y="250" width="215" height="68" rx="12" fill="#fff0ca" stroke="#c49a3c"/><rect x="390" y="250" width="220" height="68" rx="12" fill="#fff0ca" stroke="#c49a3c"/><rect x="685" y="250" width="215" height="68" rx="12" fill="#d8f1ed" stroke="#5d9e93"/></g>
    <g text-anchor="middle" font-size="15" font-weight="700"><text x="207" y="280" font-size="13">UpdateMyProfileHandler</text><text x="207" y="300" font-size="12" font-weight="400">Application</text><text x="500" y="279">UserRepositoryPort</text><text x="500" y="300" font-size="12" font-weight="400">Application sở hữu</text><text x="792" y="280">UserRepository</text><text x="792" y="300" font-size="12" font-weight="400">Infrastructure implements</text></g>
    <g stroke="#526783" stroke-width="2" marker-end="url(#arrow)"><path d="M315 284H385"/><path d="M685 284H615"/></g>
    <text x="500" y="365" text-anchor="middle" font-size="15">AppModule dùng DI để lắp adapter vào use case.</text>
    <text x="500" y="390" text-anchor="middle" font-size="14" fill="#4b6484">Use case còn gọi IdentityProviderPort để kiểm tra tài khoản qua Keycloak.</text>
  </g>
</svg>
